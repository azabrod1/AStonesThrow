<!doctype html>
<html lang="en">
<meta charset="utf-8">
<!-- Laid out at the device's width: without this a phone's browser lays the
     page out 980 pixels wide and shrinks it, every control with it, to fit.
     viewport-fit=cover lets the pond run under the notch in landscape; the
     controls and the title keep inside the safe area (env(safe-area-inset-…)). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1b22">
<title>A Stone’s Throw</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: the pond fills the viewport; a quiet title sits top-left and one
     control strip rests on the bottom edge. Single dark theme by design: the
     scene itself is the page's background. */
  :root {
    --bg: #0b1b22;
    --fg: #eef3f4;
    --muted: rgba(238, 243, 244, 0.8);
    --panel: rgba(7, 18, 24, 0.58);
    --panel-strong: rgba(7, 18, 24, 0.86);
    --line: rgba(238, 243, 244, 0.16);
    --accent: #f1c77a;
    --accent-ink: #2a1d05;
    --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    --font-ui: 'Instrument Sans', 'Helvetica Neue', Arial, system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #pond {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
    outline: none;
    -webkit-user-select: none;     /* a held press is a finger in the water: no selection or callout */
    user-select: none;
    -webkit-touch-callout: none;
  }
  .title {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: calc(env(safe-area-inset-left, 0px) + 18px);
    right: calc(env(safe-area-inset-right, 0px) + 84px);   /* clear of the settings button */
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
  }
  .title h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-style: italic;
    font-size: clamp(26px, 3.4vw, 38px);
    letter-spacing: 0.01em;
    line-height: 1;
  }
  .title p {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .stats {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 22px);
    right: calc(env(safe-area-inset-right, 0px) + 68px);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
    white-space: pre;
    text-align: right;
  }
  /* ?profile=1's report (src/profiler.js): several lines of figures, read left to right. */
  .stats.report {
    left: calc(env(safe-area-inset-left, 0px) + 18px);
    text-align: left;
    white-space: pre-wrap;
    font-size: 11px;
    line-height: 1.45;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--panel-strong);
    text-shadow: none;
    color: var(--fg);
    z-index: 1;
  }
  .controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px calc(env(safe-area-inset-right, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 16px);
    touch-action: manipulation;   /* quick taps on the buttons never zoom the page */
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to top, var(--panel-strong), var(--panel) 70%, transparent);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .group {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .group > label, .group > span.name {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    white-space: nowrap;
  }
  .segmented {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .segmented button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
    min-width: 44px;
  }
  .segmented button + button { border-left: 1px solid var(--line); }
  .segmented button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .segmented button:focus-visible, .throw:focus-visible, .reset-view:focus-visible, input[type="range"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  /* The stone slider, drawn the same on every browser: a thin track filled up
     to the thumb (--fraction, which the page sets from the value), a round
     thumb in the accent colour, and a box taller than the track so a finger
     finds it. On a touch screen the thumb is 28 px and the box 44 px tall
     (Apple's smallest comfortable target); on a phone the slider has a row of
     its own. */
  input[type="range"] {
    --thumb: 18px;
    --track: 4px;
    --fraction: 0.31;
    -webkit-appearance: none;
    appearance: none;
    width: 140px;
    height: 28px;
    margin: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    touch-action: none;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: var(--track);
    border-radius: 999px;
    background: linear-gradient(to right, var(--accent) calc(var(--thumb) / 2 + var(--fraction) * (100% - var(--thumb))), rgba(238, 243, 244, 0.28) 0);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: var(--thumb);
    height: var(--thumb);
    margin-top: calc((var(--track) - var(--thumb)) / 2);
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
  }
  input[type="range"]::-moz-range-track {
    height: var(--track);
    border-radius: 999px;
    background: rgba(238, 243, 244, 0.28);
  }
  input[type="range"]::-moz-range-progress {
    height: var(--track);
    border-radius: 999px;
    background: var(--accent);
  }
  input[type="range"]::-moz-range-thumb {
    width: var(--thumb);
    height: var(--thumb);
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
  }
  .readout {
    font-size: 13px;
    min-width: 4.4em;   /* "24.5 cm" fits, so the slider keeps its length as the size changes */
    font-variant-numeric: tabular-nums;
  }
  .throw {
    appearance: none;
    border: 1px solid var(--line);
    background: rgba(238, 243, 244, 0.08);
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .throw:hover { background: rgba(238, 243, 244, 0.16); }
  /* Shown only while the view is away from the shore's (turned, zoomed or another view): a quieter twin of the throw button. */
  .reset-view {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .reset-view:hover { background: rgba(238, 243, 244, 0.1); }
  /* On a wide screen the strip is one row; on a phone the stone and the
     throw button take the first and the row break starts the second. */
  .row-break { display: none; flex-basis: 100%; height: 0; }
  /* The settings (src/settingsPanel.js): a button at the top right and the
     card it opens under it, laid out as the Moon app's menu is: the list of
     settings, each row its name, where it stands and a chevron into its page;
     a page has the way back, the choices, and a line on what the chosen one
     means. The card's width is fixed, so a page change never moves its
     outline; it scrolls when a short screen cannot hold it. */
  .menu-button {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    width: 42px;
    height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--fg);
    cursor: pointer;
    touch-action: manipulation;
    z-index: 1;
  }
  .menu-button:hover, .menu-button[aria-expanded="true"] { background: var(--panel-strong); border-color: rgba(238, 243, 244, 0.3); }
  .menu-button svg { width: 20px; height: 20px; }
  .settings {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 62px);
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    width: min(300px, calc(100vw - 24px));
    max-height: calc(100vh - 74px - env(safe-area-inset-top, 0px));
    max-height: calc(100dvh - 74px - env(safe-area-inset-top, 0px));
    box-sizing: border-box;
    padding: 8px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-content: start;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    border-radius: 16px;
    border: 1px solid rgba(238, 243, 244, 0.12);
    background:
      linear-gradient(168deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.012) 38%, rgba(0, 0, 0, 0.05)),
      rgba(7, 18, 24, 0.84);
    backdrop-filter: blur(30px) saturate(160%);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09), 0 28px 80px rgba(0, 0, 0, 0.6);
    z-index: 1;
  }
  /* The pages share one grid cell, so one can slide out while the next slides in. */
  .menu-page { grid-area: 1 / 1 / 2 / 2; min-width: 0; }
  .menu-page-leaving { position: absolute; top: 0; left: 0; right: 0; }
  .menu-tier {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 38px;
    padding: 4px 10px;
    border: 0;
    border-radius: 9px;
    background: none;
    color: var(--fg);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .menu-tier:hover { background: rgba(238, 243, 244, 0.07); }
  .menu-tier b { flex: none; font-size: 14px; font-weight: 500; }
  .menu-tier-value {
    flex: 1;
    min-width: 0;
    text-align: right;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .menu-tier-chevron { flex: none; font-size: 16px; line-height: 1; color: rgba(238, 243, 244, 0.5); }
  .menu-head { display: flex; align-items: center; gap: 4px; padding: 2px 2px 10px; }
  .menu-head h3 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-style: italic;
    font-size: 19px;
  }
  .menu-back {
    flex: none;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 8px;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
  .menu-back:hover { background: rgba(238, 243, 244, 0.07); color: var(--fg); }
  .menu-field { padding: 0 4px 4px; }
  .menu-field-label {
    margin-bottom: 7px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .menu-seg {
    display: flex;
    height: 36px;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .menu-seg button {
    flex: 1;
    min-width: 0;
    padding: 0;
    border: 0;
    background: none;
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .menu-seg button + button { border-left: 1px solid var(--line); }
  .menu-seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .menu-note { margin: 9px 2px 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .sky-list { display: grid; gap: 4px; }
  .sky-option {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    padding: 5px;
    border: 1px solid transparent;
    border-radius: 11px;
    background: none;
    color: var(--fg);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .sky-option:hover { background: rgba(238, 243, 244, 0.07); }
  .sky-option[aria-checked="true"] { border-color: var(--accent); background: rgba(241, 199, 122, 0.1); }
  .sky-option img { flex: none; width: 80px; height: 45px; border-radius: 7px; object-fit: cover; background: rgba(238, 243, 244, 0.08); }
  .sky-option b { display: block; font-size: 14px; font-weight: 500; }
  .sky-option small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
  /* The Time page: the hour's name and local time over a slider of the
     place's hours, the first and last hour's times under its ends. */
  .time-readout { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 2px; }
  .time-readout b { font-size: 16px; font-weight: 500; }
  .time-readout span, .time-ends { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .time-ends { display: flex; justify-content: space-between; margin: 0 2px; }
  .settings input[type="range"] { display: block; width: 100%; }
  .settings input[type="range"][hidden], .time-ends[hidden] { display: none; }
  .menu-button:focus-visible, .menu-tier:focus-visible, .menu-back:focus-visible, .menu-seg button:focus-visible, .sky-option:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .veil {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    font-family: var(--font-display);
    font-style: italic;
    font-size: 20px;
    color: var(--muted);
    transition: opacity 0.6s ease;
    z-index: 2;
  }
  .veil.gone { opacity: 0; pointer-events: none; }
  .veil .error {
    font-family: var(--font-ui);
    font-style: normal;
    font-size: 15px;
    max-width: 32em;
    padding: 0 16px;
    text-align: center;
    color: var(--fg);
  }
  @media (pointer: coarse) {
    input[type="range"] { --thumb: 28px; --track: 6px; height: 44px; }
    .segmented button, .throw, .reset-view { min-height: 36px; }
  }
  /* Phones in portrait: two rows. The stone's slider, its name and size
     above it, with the throw button beside it (the view's reset in its place
     while the view is away from the shore's); then the throw's strength and the time, each name above
     its buttons. The row break comes after the buttons (order), wherever it
     sits in the page. The wind and the quality are in the settings. */
  @media (max-width: 520px) {
    .title p { display: none; }
    .controls { gap: 6px 12px; padding-top: 8px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
    .stone-group {
      flex: 1 1 200px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas: "name size" "slider slider";
      align-items: end;
      gap: 0 8px;
    }
    /* The name and the size sit in the slider's box above its 28 px thumb. */
    .stone-group > label { grid-area: name; font-size: 10px; margin-bottom: -6px; }
    .stone-group > .readout { grid-area: size; min-width: 0; text-align: right; font-size: 12px; margin-bottom: -6px; }
    .stone-group input[type="range"] { grid-area: slider; width: 100%; }
    .throw, .reset-view { order: 1; align-self: flex-end; margin-bottom: 4px; padding: 7px 12px; }
    .throw.while-away { display: none; }
    .row-break { display: block; order: 2; }
    .group:not(.stone-group) { order: 3; flex-direction: column; gap: 2px; }
    .group:not(.stone-group) > span.name { font-size: 10px; }
    .segmented button { padding: 6px 8px; min-width: 38px; }
  }
  @media (max-width: 400px) {
    .throw .more { display: none; }
  }
  /* Phones in landscape: the two rows, tighter. */
  @media (min-width: 521px) and (max-height: 450px) {
    .controls { gap: 4px 12px; padding-top: 6px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); }
    .group { gap: 6px; }
    .segmented button { padding: 6px 7px; min-width: 38px; }
    input[type="range"] { width: 120px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .veil { transition: none; }
  }
  /* Phones: the title's line is hidden there, so the readout sits on the title's row, left of the button. */
  @media (max-width: 520px) {
    .stats { font-size: 11px; }
  }
</style>

<canvas id="pond" aria-label="A pond. Tap or click the water to throw a rock. Scroll or pinch to zoom."></canvas>

<div class="title">
  <h1>A Stone’s Throw</h1>
  <p>Tap the water to throw a rock, hold to touch it, drag to look around. Space throws one for you; scroll or pinch to look closer.</p>
</div>
<div class="stats" id="stats" aria-live="off"></div>

<div class="controls" role="toolbar" aria-label="Pond controls">
  <div class="group stone-group">
    <label for="stone-size">Rock</label>
    <input type="range" id="stone-size" min="1.5" max="30" step="0.5" value="6">
    <span class="readout" id="stone-readout">6 cm</span>
  </div>
  <div class="group">
    <span class="name">Throw</span>
    <div class="segmented" id="power" role="group" aria-label="Throw strength">
      <button type="button" data-value="soft">Soft</button>
      <button type="button" data-value="normal" aria-pressed="true">Normal</button>
      <button type="button" data-value="hard">Hard</button>
    </div>
  </div>
  <div class="group">
    <span class="name">Time</span>
    <div class="segmented" id="speed" role="group" aria-label="Playback speed">
      <button type="button" data-value="1" aria-pressed="true">Real</button>
      <button type="button" data-value="0.25">¼</button>
      <button type="button" data-value="0.1">⅒</button>
    </div>
  </div>
  <div class="row-break" aria-hidden="true"></div>
  <button type="button" class="reset-view" id="reset-view" hidden>Reset view</button>
  <button type="button" class="throw" id="throw" aria-label="Throw a rock">Throw<span class="more"> a rock</span></button>
</div>

<button type="button" class="menu-button" id="menu-button" aria-label="Settings" aria-expanded="false" aria-controls="settings">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 5.5 H16 M4 10 H16 M4 14.5 H16"></path></svg>
</button>
<!-- The settings (src/settingsPanel.js): the list, and a page per setting.
     The page script fills each row's value and each page's note. -->
<div class="settings" id="settings" role="dialog" aria-label="Settings" hidden>
  <div class="menu-page" data-page="root">
    <button type="button" class="menu-tier" data-open="view"><b>View</b><span class="menu-tier-value"></span><span class="menu-tier-chevron" aria-hidden="true">&rsaquo;</span></button>
    <button type="button" class="menu-tier" data-open="water"><b>Water</b><span class="menu-tier-value"></span><span class="menu-tier-chevron" aria-hidden="true">&rsaquo;</span></button>
    <button type="button" class="menu-tier" data-open="sky"><b>Sky</b><span class="menu-tier-value"></span><span class="menu-tier-chevron" aria-hidden="true">&rsaquo;</span></button>
    <button type="button" class="menu-tier" data-open="time"><b>Time of day</b><span class="menu-tier-value"></span><span class="menu-tier-chevron" aria-hidden="true">&rsaquo;</span></button>
    <button type="button" class="menu-tier" data-open="wind"><b>Wind</b><span class="menu-tier-value"></span><span class="menu-tier-chevron" aria-hidden="true">&rsaquo;</span></button>
    <button type="button" class="menu-tier" data-open="quality"><b>Quality</b><span class="menu-tier-value"></span><span class="menu-tier-chevron" aria-hidden="true">&rsaquo;</span></button>
  </div>
  <div class="menu-page" data-page="view" hidden>
    <div class="menu-head"><button type="button" class="menu-back" aria-label="Back"><span aria-hidden="true">&lsaquo;</span></button><h3>View</h3></div>
    <div class="menu-field">
      <div class="menu-field-label" id="view-label">From</div>
      <div class="menu-seg" id="view" role="radiogroup" aria-labelledby="view-label" aria-describedby="view-note">
        <button type="button" role="radio" data-value="shore">Shore</button>
        <button type="button" role="radio" data-value="level">Low</button>
        <button type="button" role="radio" data-value="high">High</button>
        <button type="button" role="radio" data-value="under">Under</button>
      </div>
      <div class="menu-note" id="view-note"></div>
    </div>
  </div>
  <div class="menu-page" data-page="water" hidden>
    <div class="menu-head"><button type="button" class="menu-back" aria-label="Back"><span aria-hidden="true">&lsaquo;</span></button><h3>Water</h3></div>
    <div class="menu-field">
      <div class="menu-field-label" id="water-label">How clear</div>
      <div class="menu-seg" id="water" role="radiogroup" aria-labelledby="water-label" aria-describedby="water-note">
        <button type="button" role="radio" data-value="pool">Pool</button>
        <button type="button" role="radio" data-value="clear">Clear</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
  }
}
</script>
<script type="module">
  import { startPond } from './src/main.js';
  import { SettingsPanel, radioGroup } from './src/settingsPanel.js';

  const veil = document.getElementById('veil');
  const veilText = document.getElementById('veil-text');
  const stats = document.getElementById('stats');
  const resetView = document.getElementById('reset-view');
  const params = new URLSearchParams(location.search);

  function segmented(id, onChange) {
    const root = document.getElementById(id);
    root.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      for (const other of root.querySelectorAll('button')) other.setAttribute('aria-pressed', String(other === button));
      onChange(button.dataset.value);
    });
    return (value) => {
      for (const button of root.querySelectorAll('button')) button.setAttribute('aria-pressed', String(button.dataset.value === value));
    };
  }

  let pond;
  let showQuality = () => {};   // assigned once the settings exist; the calibration may call it before
  let currentView = { atHome: true, view: 'shore' };   // the last onViewChange, which comes before the settings exist too
  let showView = () => {};
  let profileDone = false;            // once the profile report is up, the readout keeps it
  try {
    // Module scripts may await at the top level; the pond starts once its sky has loaded.
    pond = await startPond({
      canvas: document.getElementById('pond'),
      quality: params.get('quality') || 'auto',
      onError: (message) => { veilText.innerHTML = ''; const p = document.createElement('p'); p.className = 'error'; p.textContent = message; veilText.append(p); },
      onStats: ({ fps, droplets, quality }) => { if (!profileDone) stats.textContent = `${Math.round(fps)} fps · ${droplets} drops · ${quality}`; },
      onViewChange: (report) => {
        currentView = report;
        resetView.hidden = report.atHome;
        document.getElementById('throw').classList.toggle('while-away', !report.atHome);
        showView();
      },
      onQualityChange: () => showQuality(),
      onProfile: (lines) => { profileDone = true; stats.classList.add('report'); stats.textContent = lines.join('\n'); },
    });
  } catch (error) {
    console.error(error);
    if (!veilText.querySelector('.error')) {
      veilText.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'error';
      p.textContent = 'The pond could not start. This page needs WebGL 2 with floating-point textures.';
      veilText.append(p);
    }
  }

  if (pond) {
    const sizeInput = document.getElementById('stone-size');
    const sizeReadout = document.getElementById('stone-readout');
    const sizeRange = { minimum: Number(sizeInput.min), maximum: Number(sizeInput.max), step: Number(sizeInput.step) };
    const applySize = () => {
      const cm = Number(sizeInput.value);
      sizeReadout.textContent = `${cm % 1 === 0 ? cm : cm.toFixed(1)} cm`;
      sizeInput.style.setProperty('--fraction', String((cm - sizeRange.minimum) / (sizeRange.maximum - sizeRange.minimum)));
      pond.setStoneRadius(cm / 200);   // slider is the stone's diameter
    };
    sizeInput.addEventListener('input', applySize);
    applySize();
    // iOS moves a range input only by its thumb. Here a touch anywhere along
    // a slider puts the thumb under the finger, and the finger drags it from
    // there (the thumb's centre runs from half a thumb in at either end).
    function followTouch(input, onInput) {
      const setFromTouch = (event) => {
        event.preventDefault();
        const touch = event.touches[0];
        if (!touch) return;
        const minimum = Number(input.min), maximum = Number(input.max), step = Number(input.step);
        const bounds = input.getBoundingClientRect();
        const thumb = parseFloat(getComputedStyle(input).getPropertyValue('--thumb')) || 0;
        const fraction = Math.min(Math.max((touch.clientX - bounds.left - thumb / 2) / Math.max(bounds.width - thumb, 1), 0), 1);
        const steps = Math.round((fraction * (maximum - minimum)) / step);
        const value = minimum + steps * step;
        if (Number(input.value) !== value) { input.value = String(value); onInput(); }
      };
      input.addEventListener('touchstart', setFromTouch, { passive: false });
      input.addEventListener('touchmove', setFromTouch, { passive: false });
    }
    followTouch(sizeInput, applySize);
    segmented('power', (value) => pond.setPower(value));
    segmented('speed', (value) => pond.setTimeScale(Number(value)));

    // The settings: each choice goes to the pond, and its row and note follow.
    const settings = new SettingsPanel({ button: document.getElementById('menu-button'), panel: document.getElementById('settings') });
    const label = (page, value) => document.querySelector(`#${page} [data-value="${value}"]`)?.querySelector('b')?.textContent ?? document.querySelector(`#${page} [data-value="${value}"]`)?.textContent ?? value;
    const NOTES = {
      view: {
        shore: 'Standing on the bank, as the pond opens.',
        level: 'Down at the water, the splash against the far shore.',
        high: 'From high above, the rings spreading over the pond.',
        under: 'Under the water, the sky in a bright window overhead and the rocks coming down through it.',
        turned: 'Turned by hand. Drag the water to look around; Reset view comes back to the shore.',
      },
      poolView: {
        shore: 'Standing on the deck at the pool\u2019s corner, looking down into it.',
        level: 'Down at the water, just inside the pool\u2019s wall.',
        high: 'From high above, the rings running back and forth off the walls.',
        under: 'Under the water, the sky in a bright window overhead and the tiles mirrored in the surface past it.',
        turned: 'Turned by hand. Drag the water to look around; Reset view comes back to the deck.',
      },
      water: {
        pool: 'A tiled pool, crystal clear: the ripples run back and forth off its walls, and the sunlight dances on its tiles.',
        clear: 'Spring water, turquoise: the sand shows far out under the shallows.',
        lake: 'A clear Alpine lake: bright sand in the shallows, deep blue where the rocks land.',
        pond: 'A green pond: the sand fades into green a little way out.',
        murky: 'A lake after rain: the sand shows only at the bank.',
      },
      wind: {
        calm: 'Still water: the shore stands in it as in a mirror.',
        breeze: 'Light ripples that blur the reflections.',
        windy: 'Ripples over the whole pond that break the reflections up.',
      },
      quality: {
        auto: 'Starts on High and steps down while the frame rate is too low, and keeps watching.',
        low: 'As Medium, with fewer pixels on sharp screens and fewer rings at once.',
        medium: 'A coarser water grid, the view under the water and the splash at half resolution, and 30 frames a second while nothing moves.',
        high: 'The finest ripples, and everything at the screen\u2019s full resolution.',
      },
      time: 'Each hour is a photograph of this place, taken from one spot through a day: the land stays where it is and the sun moves round it.',
      oneTime: 'This sky is a single photograph. Lakeside and Mesas were photographed through the day: pick one of them to change the hour.',
    };
    const showViewChoice = radioGroup(document.getElementById('view'), (value) => pond.showView(value));
    showView = () => {
      const name = currentView.view;
      showViewChoice(name);
      settings.setValue('view', name ? label('view', name) : 'Turned');
      document.getElementById('view-note').textContent = (pond.clarity === 'pool' ? NOTES.poolView : NOTES.view)[name ?? 'turned'];
    };
    const showWater = radioGroup(document.getElementById('water'), (value) => { pond.setClarity(value); updateWater(); });
    function updateWater() {
      showWater(pond.clarity);
      settings.setValue('water', label('water', pond.clarity));
      document.getElementById('water-note').textContent = NOTES.water[pond.clarity];
      showView();   // the pool's views are told otherwise
    }
    const showWind = radioGroup(document.getElementById('wind'), (value) => { pond.setWind(value); updateWind(); });
    function updateWind() {
      showWind(pond.wind);
      settings.setValue('wind', label('wind', pond.wind));
      document.getElementById('wind-note').textContent = NOTES.wind[pond.wind];
    }
    const showQualityChoice = radioGroup(document.getElementById('quality'), (value) => { pond.setQuality(value); showQuality(); });
    showQuality = () => {
      const choice = pond.automaticQuality ? 'auto' : pond.quality;
      showQualityChoice(choice);
      settings.setValue('quality', pond.automaticQuality ? `Auto \u00b7 ${label('quality', pond.quality)}` : label('quality', pond.quality));
      document.getElementById('quality-note').textContent = NOTES.quality[choice] + (pond.automaticQuality ? ` Now drawing: ${label('quality', pond.quality)}.` : '');
    };
    // A sky loads its photo first (about 6 MB); the old one stays until then.
    const skyNote = document.getElementById('sky-note');
    let skyChoice = null;   // the sky last picked here, while it loads
    const showSky = radioGroup(document.getElementById('sky'), (value) => {
      skyChoice = value;
      showSky(value);
      if (value === pond.sky) updateSky();
      else {
        settings.setValue('sky', `${label('sky', value)}\u2026`);
        skyNote.textContent = `Loading the ${label('sky', value).toLowerCase()} sky\u2026`;
      }
      // Always asked, so a load still queued for an earlier pick is dropped.
      pond.setSky(value).then((shown) => {
        if (skyChoice !== value) return;   // another was picked since: its load reports
        updateSky();
        if (shown !== value) skyNote.textContent = 'That sky could not be loaded. Check the connection and try again.';
      });
    });
    function updateSky() {
      showSky(pond.sky);
      settings.setValue('sky', label('sky', pond.sky));
      skyNote.textContent = '';
      updateTime();
    }
    // The time of day: the shown place's hours on a slider (pond.hours), a
    // lone photograph's one hour with no slider. An hour is a photo to load,
    // as a sky is: a drag asks for each hour it crosses, and only the last
    // asked for loads (pond.setHour).
    const timeInput = document.getElementById('time');
    const timeNote = document.getElementById('time-note');
    let timeChoice = null;   // the hour last picked here, while it loads
    const hourText = (hour) => (hour.clock ? `${hour.label} \u00b7 ${hour.clock}` : hour.label);
    function showHour(index) {
      const hours = pond.hours;
      const hour = hours[index];
      document.getElementById('time-name').textContent = hour.label;
      document.getElementById('time-clock').textContent = hour.clock ?? '';
      timeInput.value = String(index);
      timeInput.style.setProperty('--fraction', String(hours.length > 1 ? index / (hours.length - 1) : 0));
      timeInput.setAttribute('aria-valuetext', hourText(hour));
    }
    function updateTime() {
      const hours = pond.hours;
      const index = Math.max(0, hours.findIndex((hour) => hour.name === pond.hour));
      timeInput.max = String(hours.length - 1);
      timeInput.hidden = hours.length < 2;
      document.getElementById('time-ends').hidden = hours.length < 2;
      document.getElementById('time-first').textContent = hours[0].clock ?? '';
      document.getElementById('time-last').textContent = hours.at(-1).clock ?? '';
      showHour(index);
      settings.setValue('time', hourText(hours[index]));
      timeNote.textContent = hours.length > 1 ? NOTES.time : NOTES.oneTime;
    }
    function chooseHour() {
      const index = Number(timeInput.value);
      const hour = pond.hours[index];
      if (!hour) return;
      showHour(index);
      timeChoice = hour.name;
      if (hour.name === pond.hour) { updateTime(); return; }
      settings.setValue('time', `${hourText(hour)}\u2026`);
      timeNote.textContent = `Loading ${hour.label.toLowerCase()}\u2026`;
      pond.setHour(hour.name).then((shown) => {
        if (timeChoice !== hour.name) return;   // another was picked since: its load reports
        updateTime();
        if (shown !== hour.name) timeNote.textContent = 'That hour could not be loaded. Check the connection and try again.';
      });
    }
    timeInput.addEventListener('input', chooseHour);
    followTouch(timeInput, chooseHour);
    showView();
    updateWater();
    updateWind();
    showQuality();
    updateSky();
    document.getElementById('throw').addEventListener('click', () => pond.throwRandom());
    resetView.addEventListener('click', () => pond.resetView());
    document.getElementById('throw').addEventListener('keydown', (event) => { if (event.code === 'Space') event.stopPropagation(); });

    window.__pond = pond;
    requestAnimationFrame(() => requestAnimationFrame(() => veil.classList.add('gone')));
    if (params.get('ui') === '0') for (const el of document.querySelectorAll('.title, .controls, .stats, .menu-button')) el.hidden = true;
  }
</script>
