name: Check

# Every pull request (main's deploy runs npm test itself) runs the CPU
# probes, and beside them the browser probes headless on a macOS runner's GPU
# (Metal; free for a public repository). GitHub's Linux runners have none, and
# SwiftShader took some 27 minutes over the browser probes where Metal takes
# about 5, in two jobs side by side. PW_GPU=hardware fails rather than fall
# back to SwiftShader (tools/browser.mjs). Each job runs one of package.json's
# check scripts, the lists `npm run check` and the pre-push hook run locally,
# so CI and a local run can never check different things.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:cpu

  browser:
    name: browser (${{ matrix.part }})
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PW_GPU: hardware
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: controls, screen, frame rate, grab, uniforms
            run: npm run check:controls
          - part: quality, site, startup
            run: npm run check:site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: ${{ matrix.run }}
