name: Check

# Every pull request (main's deploy runs npm test itself) runs the CPU
# probes, and beside them the browser probes headless on a macOS runner's GPU
# (Metal; free for a public repository). GitHub's Linux runners have none, and
# SwiftShader took some 27 minutes over the browser probes where Metal takes
# about 5, in two jobs side by side. PW_GPU=hardware fails rather than fall
# back to SwiftShader (tools/browser.mjs).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tools/variety-probe.mjs
      - run: node tools/pool-probe.mjs

  browser:
    name: browser (${{ matrix.part }})
    runs-on: macos-latest
    env:
      PW_GPU: hardware
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: controls, screen, frame rate, grab, uniforms
            run: |
              node tools/controls-probe.mjs
              node tools/screen-probe.mjs
              node tools/frame-rate-probe.mjs
              node tools/grab-probe.mjs
              node tools/uniform-probe.mjs
          - part: quality, site, startup
            run: |
              node tools/quality-probe.mjs
              npm run site && node tools/site-check.mjs
              node tools/startup-probe.mjs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: ${{ matrix.run }}
